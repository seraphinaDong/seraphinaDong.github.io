<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF水印工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            border: 2px dashed #dee2e6;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #4CAF50;
            background: #f0f8f0;
        }

        .upload-area {
            text-align: center;
            cursor: pointer;
            padding: 20px;
        }

        .upload-icon {
            font-size: 4em;
            color: #6c757d;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .watermark-config {
            background: #fff;
            border-radius: 15px;
            border: 1px solid #e9ecef;
            padding: 30px;
        }

        .config-section {
            margin-bottom: 30px;
        }

        .config-section h3 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
        }

        .color-input {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .range-input {
            width: 100%;
            margin: 10px 0;
        }

        .range-value {
            display: inline-block;
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .preview-section {
            grid-column: 1 / -1;
            margin-top: 30px;
            text-align: center;
        }

        .file-info {
            background: #e8f5e8;
            border: 1px solid #c3e6c3;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            transition: width 0.3s ease;
            width: 0%;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: 500;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 PDF水印工具</h1>
            <p>轻松为您的PDF文件添加文字或图片水印</p>
        </div>

        <div class="main-content">
            <!-- 文件上传区域 -->
            <div class="upload-section">
                <div class="upload-area" onclick="document.getElementById('pdfFile').click()">
                    <div class="upload-icon">📁</div>
                    <h3>选择PDF文件</h3>
                    <p>点击这里选择要添加水印的PDF文件</p>
                    <input type="file" id="pdfFile" class="file-input" accept=".pdf">
                </div>
                <div id="fileInfo" class="file-info hidden">
                    <strong>文件信息：</strong>
                    <div id="fileName"></div>
                    <div id="fileSize"></div>
                </div>
            </div>

            <!-- 水印配置区域 -->
            <div class="watermark-config">
                <div class="config-section">
                    <h3>水印类型</h3>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="textWatermark" name="watermarkType" value="text" checked>
                            <label for="textWatermark">文字水印</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="imageWatermark" name="watermarkType" value="image">
                            <label for="imageWatermark">图片水印</label>
                        </div>
                    </div>
                </div>

                <!-- 文字水印配置 -->
                <div id="textConfig" class="config-section">
                    <div class="form-group">
                        <label class="form-label">水印文字</label>
                        <input type="text" id="watermarkText" class="form-control" placeholder="请输入水印文字" value="CONFIDENTIAL">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">字体大小</label>
                            <input type="range" id="fontSize" class="range-input" min="12" max="100" value="36">
                            <span class="range-value" id="fontSizeValue">36px</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">文字颜色</label>
                            <input type="color" id="textColor" class="color-input" value="#ff0000">
                        </div>
                    </div>
                </div>

                <!-- 图片水印配置 -->
                <div id="imageConfig" class="config-section hidden">
                    <div class="form-group">
                        <label class="form-label">选择水印图片</label>
                        <input type="file" id="watermarkImage" class="form-control" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label class="form-label">图片大小</label>
                        <input type="range" id="imageSize" class="range-input" min="50" max="500" value="150">
                        <span class="range-value" id="imageSizeValue">150px</span>
                    </div>
                </div>

                <!-- 通用配置 -->
                <div class="config-section">
                    <h3>位置和透明度</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">水印位置</label>
                            <select id="position" class="form-control">
                                <option value="center">居中</option>
                                <option value="top-left">左上角</option>
                                <option value="top-right">右上角</option>
                                <option value="bottom-left">左下角</option>
                                <option value="bottom-right">右下角</option>
                                <option value="diagonal">对角线</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">旋转角度</label>
                            <input type="range" id="rotation" class="range-input" min="-90" max="90" value="45">
                            <span class="range-value" id="rotationValue">45°</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">透明度</label>
                        <input type="range" id="opacity" class="range-input" min="0.1" max="1" step="0.1" value="0.3">
                        <span class="range-value" id="opacityValue">0.3</span>
                    </div>
                </div>
            </div>

            <!-- 操作按钮和进度显示 -->
            <div class="preview-section">
                <button id="processBtn" class="btn btn-primary" onclick="processPDF()">
                    🚀 添加水印
                </button>
                <div id="progressBar" class="progress-bar hidden">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="statusMessage" class="status-message hidden"></div>
                <div id="downloadSection" class="hidden">
                    <a id="downloadLink" class="btn btn-secondary" download="watermarked.pdf">
                        📥 下载处理后的PDF
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedPdfFile = null;
        let watermarkImageFile = null;

        // 文件选择处理
        document.getElementById('pdfFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                selectedPdfFile = file;
                displayFileInfo(file);
            } else {
                alert('请选择有效的PDF文件！');
            }
        });

        // 水印图片选择处理
        document.getElementById('watermarkImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                watermarkImageFile = file;
            }
        });

        // 水印类型切换
        document.querySelectorAll('input[name="watermarkType"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const textConfig = document.getElementById('textConfig');
                const imageConfig = document.getElementById('imageConfig');
                
                if (this.value === 'text') {
                    textConfig.classList.remove('hidden');
                    imageConfig.classList.add('hidden');
                } else {
                    textConfig.classList.add('hidden');
                    imageConfig.classList.remove('hidden');
                }
            });
        });

        // 范围输入值显示更新
        document.getElementById('fontSize').addEventListener('input', function() {
            document.getElementById('fontSizeValue').textContent = this.value + 'px';
        });

        document.getElementById('imageSize').addEventListener('input', function() {
            document.getElementById('imageSizeValue').textContent = this.value + 'px';
        });

        document.getElementById('rotation').addEventListener('input', function() {
            document.getElementById('rotationValue').textContent = this.value + '°';
        });

        document.getElementById('opacity').addEventListener('input', function() {
            document.getElementById('opacityValue').textContent = this.value;
        });

        function displayFileInfo(file) {
            document.getElementById('fileName').textContent = `文件名: ${file.name}`;
            document.getElementById('fileSize').textContent = `大小: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
            document.getElementById('fileInfo').classList.remove('hidden');
        }

        function showProgress(show) {
            document.getElementById('progressBar').classList.toggle('hidden', !show);
        }

        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
        }

        function showStatus(message, isError = false) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + (isError ? 'status-error' : 'status-success');
            statusEl.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('statusMessage').classList.add('hidden');
        }

        async function processPDF() {
            if (!selectedPdfFile) {
                alert('请先选择PDF文件！');
                return;
            }

            const watermarkType = document.querySelector('input[name="watermarkType"]:checked').value;
            
            if (watermarkType === 'text') {
                const watermarkText = document.getElementById('watermarkText').value.trim();
                if (!watermarkText) {
                    alert('请输入水印文字！');
                    return;
                }
            } else if (watermarkType === 'image' && !watermarkImageFile) {
                alert('请选择水印图片！');
                return;
            }

            try {
                showProgress(true);
                updateProgress(10);
                hideStatus();
                
                // 读取PDF文件
                const pdfBytes = await selectedPdfFile.arrayBuffer();
                updateProgress(30);
                
                // 加载PDF文档
                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
                const pages = pdfDoc.getPages();
                updateProgress(50);

                // 获取配置参数
                const position = document.getElementById('position').value;
                const rotation = parseInt(document.getElementById('rotation').value);
                const opacity = parseFloat(document.getElementById('opacity').value);

                // 为每一页添加水印
                for (let i = 0; i < pages.length; i++) {
                    const page = pages[i];
                    const { width, height } = page.getSize();

                    if (watermarkType === 'text') {
                        await addTextWatermark(page, width, height, position, rotation, opacity);
                    } else {
                        await addImageWatermark(pdfDoc, page, width, height, position, rotation, opacity);
                    }
                    
                    updateProgress(50 + (i + 1) / pages.length * 40);
                }

                // 保存PDF
                const pdfBytesWithWatermark = await pdfDoc.save();
                updateProgress(100);

                // 创建下载链接
                const blob = new Blob([pdfBytesWithWatermark], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = url;
                downloadLink.download = `watermarked_${selectedPdfFile.name}`;
                
                document.getElementById('downloadSection').classList.remove('hidden');
                showStatus('✅ 水印添加成功！请点击下载按钮获取文件。');
                
            } catch (error) {
                console.error('处理PDF时出错:', error);
                showStatus('❌ 处理PDF时出错: ' + error.message, true);
            } finally {
                showProgress(false);
            }
        }

        async function addTextWatermark(page, width, height, position, rotation, opacity) {
            const watermarkText = document.getElementById('watermarkText').value;
            const fontSize = parseInt(document.getElementById('fontSize').value);
            const textColor = document.getElementById('textColor').value;

            // 转换颜色值
            const rgb = hexToRgb(textColor);
            
            // 计算位置
            const coords = calculatePosition(width, height, position, fontSize);
            
            // 添加文字水印
            page.drawText(watermarkText, {
                x: coords.x,
                y: coords.y,
                size: fontSize,
                color: PDFLib.rgb(rgb.r / 255, rgb.g / 255, rgb.b / 255),
                rotate: PDFLib.degrees(rotation),
                opacity: opacity
            });
        }

        async function addImageWatermark(pdfDoc, page, width, height, position, rotation, opacity) {
            const imageBytes = await watermarkImageFile.arrayBuffer();
            const imageSize = parseInt(document.getElementById('imageSize').value);
            
            let image;
            if (watermarkImageFile.type === 'image/png') {
                image = await pdfDoc.embedPng(imageBytes);
            } else {
                image = await pdfDoc.embedJpg(imageBytes);
            }
            
            const coords = calculatePosition(width, height, position, imageSize);
            
            page.drawImage(image, {
                x: coords.x,
                y: coords.y,
                width: imageSize,
                height: imageSize,
                rotate: PDFLib.degrees(rotation),
                opacity: opacity
            });
        }

        function calculatePosition(pageWidth, pageHeight, position, size) {
            let x, y;
            
            switch (position) {
                case 'center':
                    x = (pageWidth - size) / 2;
                    y = (pageHeight - size) / 2;
                    break;
                case 'top-left':
                    x = 50;
                    y = pageHeight - size - 50;
                    break;
                case 'top-right':
                    x = pageWidth - size - 50;
                    y = pageHeight - size - 50;
                    break;
                case 'bottom-left':
                    x = 50;
                    y = 50;
                    break;
                case 'bottom-right':
                    x = pageWidth - size - 50;
                    y = 50;
                    break;
                case 'diagonal':
                    x = pageWidth * 0.2;
                    y = pageHeight * 0.2;
                    break;
                default:
                    x = (pageWidth - size) / 2;
                    y = (pageHeight - size) / 2;
            }
            
            return { x, y };
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 0, b: 0 };
        }
    </script>
</body>
</html>
